# Managed by ChatSeek.
# These zones are in nginx's http context (sites-enabled is included there).
limit_req_zone $binary_remote_addr zone=chatseek_activate:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=chatseek_connections:1m;
server {
    listen 80;
    server_name __DOMAIN__;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chatseek-acme;
    }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/chatseek-error.log warn;
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    client_body_timeout 15s;
    limit_conn chatseek_connections 12;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/chatseek-acme;
    }
    location = /health {
        include /etc/nginx/snippets/chatseek-proxy.conf;
    }
    location = /v1/activate {
        limit_req zone=chatseek_activate burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/chatseek-proxy.conf;
    }
    location = /v1/quota {
        include /etc/nginx/snippets/chatseek-proxy.conf;
    }
    location = /v1/chat/completions {
        include /etc/nginx/snippets/chatseek-proxy.conf;
    }
    location / { return 404; }
}
