name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight test dependencies
        run: python -m pip install psutil==7.1.3 tzdata==2025.2 sqlcipher3==0.6.3 Pillow==12.0.0 zstandard==0.25.0 pycryptodome==3.23.0 faiss-cpu==1.15.1 imageio-ffmpeg==0.6.0
      - name: Run synthetic Python tests
        run: python -m unittest discover -s tests
      - name: Run stream transport tests
        run: |
          node --test tests/test_stream_transport.js tests/test_setup_flow.js
      - name: Check native SQLCipher and packaged dependencies
        run: python chatseek_desktop.py --chatseek-self-test
