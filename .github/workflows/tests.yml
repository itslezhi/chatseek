name: Synthetic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight test dependencies
        run: python -m pip install Pillow==12.0.0 zstandard==0.25.0 pycryptodome==3.23.0 faiss-cpu==1.15.1 imageio-ffmpeg==0.6.0
      - name: Run synthetic Python tests
        run: python -m unittest discover -s tests
      - name: Run stream transport tests
        run: node tests/test_stream_transport.js
